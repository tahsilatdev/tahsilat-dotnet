# Publishes the package to nuget.org through Trusted Publishing: no long-lived
# API key is stored anywhere. nuget.org exchanges GitHub's OIDC token for a
# one-hour API key, provided a Trusted Publishing policy exists on nuget.org for
#   Repository Owner: tahsilatdev
#   Repository:       tahsilat-dotnet
#   Workflow File:    publish.yml
# and the repository secret NUGET_USER holds the nuget.org profile name (not the
# e-mail) of the account that owns the policy and the package.
#
# Runs when a version tag (v1.2.0, v1.2.1, ...) is pushed, or by hand from the
# Actions tab for an existing tag.

name: Publish to NuGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v1.2.0"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest   # .NET Framework targets need the Windows reference assemblies
    permissions:
      contents: read
      id-token: write         # lets GitHub issue the OIDC token NuGet/login exchanges

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Check that the tag matches <Version> in the csproj
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag || github.ref_name }}'
          $expected = $tag.TrimStart('v')
          [xml]$csproj = Get-Content src/Tahsilat.NET/Tahsilat.NET.csproj
          $version = $csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($version -ne $expected) {
            Write-Error "Tag $tag does not match <Version>$version</Version> in Tahsilat.NET.csproj."
            exit 1
          }
          "Publishing version $version"

      - name: Unit tests
        run: dotnet test tests/Tahsilat.NET.Tests/Tahsilat.NET.Tests.csproj -c Release --nologo

      - name: Pack
        run: dotnet pack src/Tahsilat.NET/Tahsilat.NET.csproj -c Release --nologo -o artifacts

      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
